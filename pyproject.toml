[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfaith-bench"
version = "0.1.0"
description = "Evaluation utilities for RSFaith-Bench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0",
  "requests>=2.31",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsfaith_bench*"]
